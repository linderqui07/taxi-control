<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control Taxi</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <!-- HEADER -->
    <header class="header">
        <h1>🚕 Control Taxi</h1>
        <p id="mesActual">Junio 2026</p>
    </header>

    <!-- TARJETA SALDO -->
    <section class="saldo-card">
        <div class="saldo-header">
            <h2>Saldo Actual</h2>
        </div>

        <div class="saldo-valor" id="saldoMes">
            $0.00
        </div>

        <p class="saldo-texto">
            Disponible este mes
        </p>
    </section>

    <!-- INGRESOS / EGRESOS -->
    <section class="resumen-grid">

        <div class="mini-card ingresos">
            <h3>📈 Ingresos</h3>
            <p id="ingresosMes">$0.00</p>
        </div>

        <div class="mini-card egresos">
            <h3>📉 Egresos</h3>
            <p id="egresosMes">$0.00</p>
        </div>

    </section>

    <!-- MOVIMIENTOS RECIENTES -->
    <section class="movimientos">

        <div class="titulo-seccion">
            <h2>Movimientos Recientes</h2>
        </div>

        <div id="listaMovimientos">

            <div class="movimiento">
                <span>Taxi - Turno Día</span>
                <span class="positivo">+$45.00</span>
            </div>

            <div class="movimiento">
                <span>Combustible</span>
                <span class="negativo">-$20.00</span>
            </div>

            <div class="movimiento">
                <span>Extra - Gatito</span>
                <span class="positivo">+$15.00</span>
            </div>

        </div>

    </section>

</div>

<!-- BOTONES FLOTANTES -->

<div class="acciones">

    <button class="btn-ingreso" onclick="mostrar('ingreso')">
        ➕ Ingreso
    </button>

    <button class="btn-egreso" onclick="mostrar('egreso')">
        ➖ Egreso
    </button>

</div>

<!-- FORMULARIO INGRESO -->

<div id="ingreso" class="modal oculto">

    <div class="modal-content">

        <h2>Nuevo Ingreso</h2>

        <input type="date" id="fechaIngreso">

        <select id="turno">
            <option value="dia">Turno Día</option>
            <option value="noche">Turno Noche</option>
        </select>

        <input type="number"
               id="montoIngreso"
               placeholder="Monto">

        <select id="tipoIngreso" onchange="toggleExtra()">
            <option value="taxi">Taxi</option>
            <option value="extra">Extra</option>
        </select>

        <select id="persona" class="oculto">
            <option>Gatito</option>
            <option>Luis Miguel</option>
            <option>Linder</option>
        </select>

        <button onclick="guardarIngreso()">
            Guardar
        </button>

        <button onclick="volver()">
            Cancelar
        </button>

    </div>

</div>

<!-- FORMULARIO EGRESO -->

<div id="egreso" class="modal oculto">

    <div class="modal-content">

        <h2>Nuevo Egreso</h2>

        <input type="date" id="fechaEgreso">

        <input type="text"
               id="descEgreso"
               placeholder="Descripción">

        <input type="number"
               id="montoEgreso"
               placeholder="Monto">

        <select id="categoria">
            <option>Prestamos</option>
            <option>Comida</option>
            <option>Mantenimiento</option>
            <option>Tarjeta</option>
            <option>Servicios Basicos</option>
            <option>Otros</option>
        </select>

        <button onclick="guardarEgreso()">
            Guardar
        </button>

        <button onclick="volver()">
            Cancelar
        </button>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
