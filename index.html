<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control Taxi</title>
    <link rel="stylesheet" href="style.css">
    <!-- Librería para exportar PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>
<div class="container">
    <!-- HEADER -->
    <header class="header">
        <h1>🚕 Control Taxi</h1>
        <div class="mes-nav">
            <button onclick="cambiarMes(-1)">‹</button>
            <p id="mesActual">Junio 2026</p>
            <button onclick="cambiarMes(1)">›</button>
        </div>
    </header>

    <!-- TARJETA SALDO -->
    <section class="saldo-card">
        <div class="saldo-header">
            <h2>Saldo del Mes</h2>
        </div>
        <div class="saldo-valor" id="saldoMes">$0.00</div>
        <p class="saldo-texto">Ingresos − Egresos</p>
    </section>

    <!-- INGRESOS / EGRESOS -->
    <section class="resumen-grid">
        <div class="mini-card ingresos">
            <h3>📈 Ingresos</h3>
            <p id="ingresosMes">$0.00</p>
        </div>
        <div class="mini-card egresos">
            <h3>📉 Egresos</h3>
            <p id="egresosMes">$0.00</p>
        </div>
    </section>

    <!-- RESUMEN RÁPIDO -->
    <section class="resumen-detalle">
        <div class="detalle-item">
            <span>Solo Taxi</span>
            <strong id="soloTaxi">$0.00</strong>
        </div>
        <div class="detalle-item">
            <span>Extras</span>
            <strong id="totalExtras">$0.00</strong>
        </div>
    </section>

    <!-- PESTAÑAS -->
    <div class="tabs">
        <button class="tab active" onclick="cambiarVista('lista')" id="tabLista">Lista</button>
        <button class="tab" onclick="cambiarVista('semana')" id="tabSemana">Semana</button>
    </div>

    <!-- VISTA LISTA -->
    <section class="movimientos" id="vistaLista">
        <div class="titulo-seccion">
            <h2>Movimientos del Mes</h2>
        </div>
        <div id="listaMovimientos"></div>
    </section>

    <!-- VISTA SEMANA -->
    <section class="vista-semana oculto" id="vistaSemana">
        <div class="semana-nav">
            <button onclick="cambiarSemana(-1)">‹ Semana</button>
            <span id="rangoSemana">Semana 1</span>
            <button onclick="cambiarSemana(1)">Semana ›</button>
        </div>

        <div id="contenidoSemana">
            <!-- Se genera con JS -->
        </div>
    </section>

    <!-- BOTÓN EXPORTAR PDF -->
    <button class="btn-pdf" onclick="exportarPDF()">📄 Exportar PDF</button>
</div>

<!-- BOTONES FLOTANTES -->
<div class="acciones">
    <button class="btn-ingreso" onclick="mostrar('ingreso')">➕ Ingreso</button>
    <button class="btn-egreso" onclick="mostrar('egreso')">➖ Egreso</button>
</div>

<!-- MODAL INGRESO -->
<div id="ingreso" class="modal oculto">
    <div class="modal-content">
        <h2>Nuevo Ingreso</h2>
        <input type="date" id="fechaIngreso">
        <select id="tipoIngreso" onchange="toggleExtra()">
            <option value="taxi">Taxi</option>
            <option value="extra">Extra</option>
        </select>
        <select id="turno">
            <option value="dia">Turno Día</option>
            <option value="noche">Turno Noche</option>
        </select>
        <select id="persona" class="oculto">
            <option value="Gatito">Gatito</option>
            <option value="Luis Miguel">Luis Miguel</option>
            <option value="Linder">Linder</option>
        </select>
        <input type="number" id="montoIngreso" placeholder="Monto" step="0.01" min="0">
        <button onclick="guardarIngreso()">Guardar</button>
        <button class="btn-cancelar" onclick="volver()">Cancelar</button>
    </div>
</div>

<!-- MODAL EGRESO -->
<div id="egreso" class="modal oculto">
    <div class="modal-content">
        <h2>Nuevo Egreso</h2>
        <input type="date" id="fechaEgreso">
        <input type="text" id="descEgreso" placeholder="Descripción">
        <select id="categoria">
            <option value="Combustible">Combustible</option>
            <option value="Mantenimiento">Mantenimiento</option>
            <option value="Prestamos">Préstamos</option>
            <option value="Comida">Comida</option>
            <option value="Tarjeta">Tarjeta</option>
            <option value="Servicios Basicos">Servicios Básicos</option>
            <option value="Otros">Otros</option>
        </select>
        <input type="number" id="montoEgreso" placeholder="Monto" step="0.01" min="0">
        <button onclick="guardarEgreso()">Guardar</button>
        <button class="btn-cancelar" onclick="volver()">Cancelar</button>
    </div>
</div>

<script type="module" src="script.js"></script>
</body>
</html>
